spring.application.name=tailorshop

# MySQL database (local server on port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/tailorshop
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# File upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Custom upload directory (relative to project root)
upload.dir=uploads/products

# AWS S3 settings
# NOTE: AWS Access Keys have been DEACTIVATED & DELETED for security reasons
# Use environment variables or a separate configuration file for credentials
aws.s3.bucket=tailorshop-bucket-images
aws.region=eu-north-1
aws.accessKey=[DEACTIVATED - Use environment variables]
aws.secretKey=[DEACTIVATED - Use environment variables]
