spring.application.name=tailorshop

# MySQL database (local server on port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/tailorshop
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# File upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Custom upload directory (relative to project root)
upload.dir=uploads/products

