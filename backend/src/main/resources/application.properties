spring.application.name=tailorshop

# Database Configuration (H2 file-based database by default - zero setup required!)
spring.datasource.url=jdbc:h2:file:./data/tailorshopdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Uncomment the lines below if you prefer to use a local MySQL server instead:
# spring.datasource.url=jdbc:mysql://localhost:3307/tailorshop?createDatabaseIfNotExist=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Custom upload directory
upload.dir=uploads/products

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:xwjsjjop}
cloudinary.api-key=${CLOUDINARY_API_KEY:827331324219478}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:3RvptwjtFvCTvJpr0Sq6loTGb5A}

