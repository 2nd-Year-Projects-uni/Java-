<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailor Shop - Login/Register</title>
  
  <!-- Bootstrap -->
  <link href="css/bootstrap-4.4.1.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-light navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Tailor.</a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-between" id="navMenu">
            <div class="nav-left navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="aboutus.html">About Us</a>
                <a class="nav-link" href="services.html">Services</a>
                <a class="nav-link" href="contactus.html">Contact Us</a>
            </div>

            <div class="nav-right navbar-nav">
                <a class="nav-link" href="trackorder.html">Track Order</a>
                <a class="nav-link" href="shop.html">Shop</a>
                <a class="nav-link book-btn" href="cart.html">Cart</a>
                <a class="nav-link" href="login.html">Login</a>
            </div>
        </div>
    </div>
  </nav>

<!-- AUTH PAGE -->
<section class="auth-bg">
  <div class="auth-card">

    <!-- LEFT : IMAGE CAROUSEL -->
    <div class="auth-carousel">
      <div class="carousel-slide active" style="background-image:url('images/img1.png')"></div>
      <div class="carousel-slide" style="background-image:url('images/img2.png')"></div>
      <div class="carousel-slide" style="background-image:url('images/img3.png')"></div>

      <div class="carousel-overlay"></div>
    </div>

    <!-- RIGHT : FORM -->
    <div class="auth-form">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Login or create an account</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab">Login</button>
        <button class="auth-tab" id="registerTab">Register</button>
      </div>

      <!-- LOGIN -->
      <div class="auth-panel active" id="loginPanel">
        <form>
          <div class="form-group">
            <label>Email</label>
            <input class="form-control" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" required>
          </div>

          <button class="auth-btn">Login</button>

          <div class="auth-footer">
            <p>No account? <a href="#" id="toRegister">Register</a></p>
            <p>Admin? <a href="login-admin.html">Admin Login</a></p>
          </div>
        </form>
      </div>

      <!-- REGISTER -->
      <div class="auth-panel" id="registerPanel">
        <form>
          <div class="form-group">
            <label>Username</label>
            <input class="form-control" required>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input class="form-control" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" required>
          </div>

          <button class="auth-btn">Create Account</button>

          <div class="auth-footer">
            <p>Already have an account? <a href="#" id="toLogin">Login</a></p>
          </div>
        </form>
      </div>
    </div>

  </div>
</section>

<script>
const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const loginPanel = document.getElementById("loginPanel");
const registerPanel = document.getElementById("registerPanel");

loginTab.onclick = () => {
  loginTab.classList.add("active");
  registerTab.classList.remove("active");
  loginPanel.classList.add("active");
  registerPanel.classList.remove("active");
};

registerTab.onclick = () => {
  registerTab.classList.add("active");
  loginTab.classList.remove("active");
  registerPanel.classList.add("active");
  loginPanel.classList.remove("active");
};

// Carousel
let slides = document.querySelectorAll(".carousel-slide");
let index = 0;
setInterval(() => {
  slides[index].classList.remove("active");
  index = (index + 1) % slides.length;
  slides[index].classList.add("active");
}, 4500);
</script>

</body>
</html>
