<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailor Shop - Login/Register</title>

  <!-- Bootstrap -->
  <link href="css/bootstrap-4.4.1.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="login.css">
  <!-- User Auth Styles -->
  <link rel="stylesheet" href="user-auth.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-light navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Tailor.</a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-between" id="navMenu">
        <div class="nav-left navbar-nav">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="aboutus.html">About Us</a>
          <a class="nav-link" href="services.html">Services</a>
          <a class="nav-link" href="contactus.html">Contact Us</a>
        </div>

        <div class="nav-right navbar-nav">
          <a class="nav-link" href="trackorder.html">Track Order</a>
          <a class="nav-link" href="shop.html">Shop</a>
          <a class="nav-link book-btn" href="cart.html">Cart</a>
          <a class="nav-link" href="login.html">Login</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- AUTH PAGE -->
  <section class="auth-bg">
    <div class="auth-card">

      <!-- LEFT : IMAGE CAROUSEL -->
      <div class="auth-carousel">
        <div class="carousel-slide active" style="background-image:url('images/img1.png')"></div>
        <div class="carousel-slide" style="background-image:url('images/img2.png')"></div>
        <div class="carousel-slide" style="background-image:url('images/img3.png')"></div>

        <div class="carousel-overlay"></div>
      </div>

      <!-- RIGHT : FORM -->
      <div class="auth-form">
        <div class="auth-header">
          <h2>Welcome Back</h2>
          <p>Login or create an account</p>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" id="loginTab">Login</button>
          <button class="auth-tab" id="registerTab">Register</button>
        </div>

        <div class="auth-panels">
          <!-- LOGIN -->
          <div class="auth-panel active" id="loginPanel">
            <form>
              <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
              </div>

              <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" required>
              </div>

              <button class="auth-btn">Login</button>

              <div class="auth-footer">
                <p>No account? <a href="#" id="toRegister">Register</a></p>
                <p>Admin? <a href="login-admin.html">Admin Login</a></p>
              </div>
            </form>
          </div>

          <!-- REGISTER -->
          <div class="auth-panel" id="registerPanel">
            <form>
              <div class="form-group">
                <label>Username</label>
                <input class="form-control" required>
              </div>

              <div class="form-group">
                <label>Email</label>
                <input class="form-control" required>
              </div>

              <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" required>
              </div>

              <button class="auth-btn">Create Account</button>

              <div class="auth-footer">
                <p>Already have an account? <a href="#" id="toLogin">Login</a></p>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </section>

  <script>
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const loginPanel = document.getElementById("loginPanel");
    const registerPanel = document.getElementById("registerPanel");
    const panelsContainer = document.querySelector(".auth-panels");
    const toRegister = document.getElementById("toRegister");
    const toLogin = document.getElementById("toLogin");

    loginTab.onclick = () => {
      loginTab.classList.add("active");
      registerTab.classList.remove("active");
      loginPanel.classList.add("active");
      registerPanel.classList.remove("active");
    };

    registerTab.onclick = () => {
      registerTab.classList.add("active");
      loginTab.classList.remove("active");
      registerPanel.classList.add("active");
      loginPanel.classList.remove("active");
    };

    // Switch tabs via footer links
    if (toRegister) {
      toRegister.addEventListener("click", (e) => {


        e.preventDefault();
        registerTab.onclick();
      });
    }

    if (toLogin) {
      toLogin.addEventListener("click", (e) => {
        e.preventDefault();
        loginTab.onclick();
      });
    }

    // Ensure equal height for both panels
    function setPanelsHeight() {
      // Temporarily show both to measure their natural height
      const prevLoginActive = loginPanel.classList.contains("active");
      const prevRegisterActive = registerPanel.classList.contains("active");

      loginPanel.classList.add("measure");
      registerPanel.classList.add("measure");

      const maxH = Math.max(loginPanel.scrollHeight, registerPanel.scrollHeight);
      panelsContainer.style.height = maxH + "px";

      loginPanel.classList.remove("measure");
      registerPanel.classList.remove("measure");

      // Restore active classes (no visual change during measure state)
      if (!prevLoginActive) loginPanel.classList.remove("active");
      if (!prevRegisterActive) registerPanel.classList.remove("active");
    }

    window.addEventListener("load", setPanelsHeight);
    window.addEventListener("resize", setPanelsHeight);

    // Carousel
    let slides = document.querySelectorAll(".carousel-slide");
    let index = 0;
    setInterval(() => {
      slides[index].classList.remove("active");
      index = (index + 1) % slides.length;
      slides[index].classList.add("active");
    }, 4500);

    // --- LOGIN/REGISTER LOGIC ---
    const loginForm = document.querySelector('#loginPanel form');
    const registerForm = document.querySelector('#registerPanel form');

    function showError(form, msg) {
      let err = form.querySelector('.auth-error');
      if (!err) {
        err = document.createElement('div');
        err.className = 'auth-error';
        err.style.color = 'red';
        err.style.margin = '8px 0';
        form.insertBefore(err, form.firstChild);
      }
      err.textContent = msg;
    }
    function clearError(form) {
      let err = form.querySelector('.auth-error');
      if (err) err.remove();
    }

    function setSession(user) {
      localStorage.setItem('userSession', JSON.stringify(user));
    }

    if (registerForm) {
      registerForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearError(registerForm);
        const inputs = registerForm.querySelectorAll('input');
        const username = inputs[0].value.trim();
        const email = inputs[1].value.trim();
        const password = inputs[2].value;
        if (!username || !email || !password) {
          showError(registerForm, 'All fields are required.');
          return;
        }
        try {
          const res = await fetch('http://localhost:8080/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: username, email, password })
          });
          const data = await res.json();
          if (!data.success) {
            showError(registerForm, data.message || 'Registration failed');
            return;
          }
          // setSession(data.data); // Removed auto-login
          let successMsg = registerForm.querySelector('.auth-success');
          if (!successMsg) {
            successMsg = document.createElement('div');
            successMsg.className = 'auth-success';
            successMsg.style.color = 'green';
            successMsg.style.margin = '8px 0';
            registerForm.appendChild(successMsg);
          }
          successMsg.textContent = 'Registration successful! Please login to continue.';
          setTimeout(() => {
            // Switch to login tab
            if (loginTab) loginTab.onclick();
          }, 1500);
        } catch (err) {
          showError(registerForm, 'Server error');
        }
      });
    }

    if (loginForm) {
      loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearError(loginForm);
        const email = loginForm.querySelector('input[type=email], input[type=text][name=email]').value.trim();
        const password = loginForm.querySelector('input[type=password]').value;
        if (!email || !password) {
          showError(loginForm, 'Both fields are required.');
          return;
        }
        try {
          const res = await fetch('http://localhost:8080/api/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (!data.success) {
            showError(loginForm, data.message || 'Login failed');
            return;
          }
          setSession(data.data);
          window.location.href = 'index.html';
        } catch (err) {
          showError(loginForm, 'Server error');
        }
      });
    }
  </script>

  <script src="js/user-navbar.js"></script>
</body>

</html>
