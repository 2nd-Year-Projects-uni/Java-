<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Products - Tailor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Tailor Admin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="admin-products.html" class="nav-item active">
                    <i class="fas fa-box"></i>
                    <span>Products</span>
                </a>
                <a href="login-admin.html" class="nav-item">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-title">Products</h1>
                </div>
                <div class="topbar-right">
                    <div class="admin-profile">
                        <i class="fas fa-user-circle"></i>
                        <span class="admin-name">Admin User</span>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">

                <section class="page-actions">
                    <div class="action-group">
                        <button class="btn btn-primary" id="openAddProductBtn">
                            <i class="fas fa-plus"></i>
                            Add Product
                        </button>
                        <button class="btn btn-ghost">
                            <i class="fas fa-file-export"></i>
                            Export CSV
                        </button>
                    </div>
                    <div class="action-group">
                        <div class="input-wrap">
                            <i class="fas fa-search"></i>
                            <input type="text" placeholder="Search products" aria-label="Search products">
                        </div>
                        <select class="select" aria-label="Filter by status">
                            <option value="">All Status</option>
                            <option>Active</option>
                            <option>Inactive</option>
                            <option>Low Stock</option>
                        </select>
                    </div>
                </section>

                <div class="modal-overlay" id="addProductModal" aria-hidden="true">
                    <div class="modal">
                        <div class="modal-header">
                            <h3>Add Product</h3>
                            <button class="icon-btn" id="closeAddProductBtn" aria-label="Close">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="form-tabs">
                            <button class="form-tab active" data-tab="readymade">Readymade</button>
                            <button class="form-tab" data-tab="custom">Custom Made</button>
                        </div>
                        <div class="form-tab-content">
                            <form id="readymadeForm" class="form-grid form-tab-pane active">
                                <div class="form-group">
                                    <label for="readyName">Name</label>
                                    <input type="text" id="readyName" name="name" required>
                                </div>
                                <div class="form-group">
                                    <label for="readyDescription">Description</label>
                                    <textarea id="readyDescription" name="description" rows="3" required></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="readyPrice">Price <span id="readyPriceUnit" class="price-unit"></span></label>
                                    <input type="number" id="readyPrice" name="price" min="0" step="0.01" required>
                                </div>
                                <div class="form-group">
                                    <label for="readyCategory">Category</label>
                                    <select id="readyCategory" name="category" required>
                                        <option value="">Select Category</option>
                                        <option value="Readymade - Men">Readymade - Men</option>
                                        <option value="Readymade - Women">Readymade - Women</option>
                                        <option value="Materials">Materials</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="readyImage">Image</label>
                                    <input type="file" id="readyImage" name="image" accept="image/*" required>
                                    <small>Max 5MB. jpg/jpeg/png/gif/webp.</small>
                                </div>
                                <div class="form-actions">
                                    <button type="button" class="btn btn-ghost" id="cancelReadymadeBtn">Cancel</button>
                                    <button type="submit" class="btn btn-primary">Save Product</button>
                                </div>
                                <p class="form-status" id="readymadeStatus"></p>
                            </form>
                            <form id="customForm" class="form-grid form-tab-pane">
                                <div class="form-group">
                                    <label for="customName">Name</label>
                                    <input type="text" id="customName" name="name" required>
                                </div>
                                <div class="form-group">
                                    <label for="customPrice">Price</label>
                                    <input type="number" id="customPrice" name="price" min="0" step="0.01" required>
                                </div>
                                <div class="form-group">
                                    <label for="customType">Type</label>
                                    <select id="customType" name="productType" required>
                                        <option value="">Select Type</option>
                                        <option value="Trouser">Trouser</option>
                                        <option value="Shirt">Shirt</option>
                                    </select>
                                </div>
                                <div id="trouserFields" class="form-group hidden">
                                    <label for="customWaist">Waist (inches)</label>
                                    <input type="number" id="customWaist" name="waist" min="0" step="0.01">
                                </div>
                                <div id="shirtFields" class="form-group hidden">
                                    <label for="customChest">Chest (inches)</label>
                                    <input type="number" id="customChest" name="chest" min="0" step="0.01">
                                </div>
                                <div class="form-group">
                                    <label for="customLength">Length (inches)</label>
                                    <input type="number" id="customLength" name="length" min="0" step="0.01">
                                </div>
                                <div id="inseamField" class="form-group hidden">
                                    <label for="customInseam">Inseam (inches)</label>
                                    <input type="number" id="customInseam" name="inseam" min="0" step="0.01">
                                </div>
                                <div id="sleeveField" class="form-group hidden">
                                    <label for="customSleeve">Sleeve (inches)</label>
                                    <input type="number" id="customSleeve" name="sleeve" min="0" step="0.01">
                                </div>
                                <div class="form-group">
                                    <label for="customImage">Image</label>
                                    <input type="file" id="customImage" name="image" accept="image/*" required>
                                    <small>Max 5MB. jpg/jpeg/png/gif/webp.</small>
                                </div>
                                <div class="form-actions">
                                    <button type="button" class="btn btn-ghost" id="cancelCustomBtn">Cancel</button>
                                    <button type="submit" class="btn btn-primary">Save Product</button>
                                </div>
                                <p class="form-status" id="customStatus"></p>
                            </form>
                        </div>
                    </div>
                </div>

                <section class="orders-section">
                    <div class="section-header">
                        <h2 class="section-title">Product List</h2>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Updated</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productListTableBody">
                            </tbody>
                        </table>
                    </div>
                </section>

                <section class="orders-section">
                    <div class="section-header">
                        <h2 class="section-title">Material List</h2>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Updated</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="materialListTableBody">
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </main>
    </div>
    <script>
        const modal = document.getElementById('addProductModal');
        const openBtn = document.getElementById('openAddProductBtn');
        const closeBtn = document.getElementById('closeAddProductBtn');
        const tabButtons = document.querySelectorAll('.form-tab');
        const tabPanes = document.querySelectorAll('.form-tab-pane');
        const readymadeForm = document.getElementById('readymadeForm');
        const customForm = document.getElementById('customForm');
        const readyCategory = document.getElementById('readyCategory');
        const readyPriceUnit = document.getElementById('readyPriceUnit');
        const customTypeSelect = document.getElementById('customType');
        const trouserFields = document.getElementById('trouserFields');
        const shirtFields = document.getElementById('shirtFields');
        const inseamField = document.getElementById('inseamField');
        const sleeveField = document.getElementById('sleeveField');

        const updatePriceUnit = () => {
            const category = readyCategory.value;
            readyPriceUnit.textContent = category === 'Materials' ? '(per meter)' : '';
        };

        const toggleModal = (show) => {
            modal.setAttribute('aria-hidden', show ? 'false' : 'true');
            modal.classList.toggle('open', show);
        };

        function loadProductList() {
            fetch('http://localhost:8080/api/products')
                .then(response => response.json())
                .then(apiResponse => {
                    let products = apiResponse.data || apiResponse;
                    if (!Array.isArray(products)) {
                        products = [];
                    }

                    const readymadeProducts = products.filter(p => p.category && !p.category.includes('Materials'));
                    const materials = products.filter(p => p.category === 'Materials');

                    loadTableData('productListTableBody', readymadeProducts);
                    loadTableData('materialListTableBody', materials);
                })
                .catch(error => {
                    console.error('Error fetching products:', error);
                });
        }

        function loadTableData(tableBodyId, products) {
            const tbody = document.getElementById(tableBodyId);
            tbody.innerHTML = '';

            if (!products || products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No items available</td></tr>';
                return;
            }

            products.forEach(product => {
                const row = document.createElement('tr');
                row.setAttribute('data-product-id', product.id);
                const date = product.createdDate ? new Date(product.createdDate).toLocaleDateString() : 'N/A';
                const stock = product.stock || 0;
                let stockChipClass = 'chip-success';
                if (stock <= 5) {
                    stockChipClass = 'chip-danger';
                } else if (stock <= 20) {
                    stockChipClass = 'chip-warning';
                }
                
                row.innerHTML = `
                    <td class="td-id">${product.id}</td>
                    <td class="td-name">${product.name}</td>
                    <td class="td-category">${product.category}</td>
                    <td class="td-price">Rs ${parseFloat(product.price).toFixed(2)}</td>
                    <td class="td-stock"><span class="chip ${stockChipClass}">${stock}</span></td>
                    <td class="td-date">${date}</td>
                    <td class="table-actions">
                        <button class="icon-btn" onclick="editProductRow(${product.id})" aria-label="Edit"><i class="fas fa-pen"></i></button>
                        <button class="icon-btn danger" onclick="deleteProductRow(${product.id})" aria-label="Delete"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                row.dataset.productName = product.name;
                row.dataset.productCategory = product.category;
                row.dataset.productPrice = product.price;
                row.dataset.productStock = stock;
                
                tbody.appendChild(row);
            });
        }

        function editProductRow(productId) {
            const row = document.querySelector(`tr[data-product-id="${productId}"]`);
            if (row.classList.contains('editing')) {
                cancelEditProductRow(productId);
                return;
            }
            
            row.classList.add('editing');
            
            const nameCell = row.querySelector('.td-name');
            const categoryCell = row.querySelector('.td-category');
            const priceCell = row.querySelector('.td-price');
            const stockCell = row.querySelector('.td-stock');
            const actionsCell = row.querySelector('.table-actions');
            
            const name = nameCell.textContent;
            const category = categoryCell.textContent;
            const price = parseFloat(priceCell.textContent.replace('Rs ', ''));
            const stock = parseInt(stockCell.textContent);
            
            nameCell.innerHTML = `<input type="text" class="edit-input" value="${name}" placeholder="Name">`;
            categoryCell.innerHTML = `<input type="text" class="edit-input" value="${category}" placeholder="Category">`;
            priceCell.innerHTML = `<input type="number" class="edit-input" value="${price}" step="0.01" min="0" placeholder="Price">`;
            stockCell.innerHTML = `<input type="number" class="edit-input" value="${stock}" min="0" placeholder="Stock">`;
            
            actionsCell.innerHTML = `
                <button class="icon-btn success" onclick="saveProductRow(${productId})" aria-label="Save"><i class="fas fa-check"></i></button>
                <button class="icon-btn" onclick="cancelEditProductRow(${productId})" aria-label="Cancel"><i class="fas fa-times"></i></button>
            `;
        }

        function saveProductRow(productId) {
            const row = document.querySelector(`tr[data-product-id="${productId}"]`);
            
            const name = row.querySelector('.td-name input').value.trim();
            const category = row.querySelector('.td-category input').value.trim();
            const price = parseFloat(row.querySelector('.td-price input').value);
            const stock = parseInt(row.querySelector('.td-stock input').value);
            
            if (!name || !category || isNaN(price) || isNaN(stock)) {
                alert('Please fill in all fields with valid values');
                return;
            }
            
            const formData = new FormData();
            formData.append('name', name);
            formData.append('description', '');
            formData.append('category', category);
            formData.append('price', price);
            formData.append('stock', stock);
            
            fetch(`http://localhost:8080/api/products/${productId}`, {
                method: 'PUT',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    row.classList.remove('editing');
                    loadProductList();
                } else {
                    alert('Failed to save: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error saving product:', error);
                alert('Error saving product');
            });
        }

        function cancelEditProductRow(productId) {
            const row = document.querySelector(`tr[data-product-id="${productId}"]`);
            row.classList.remove('editing');
            loadProductList();
        }

        function deleteProductRow(productId) {
            if (confirm('Are you sure you want to delete this product?')) {
                fetch(`http://localhost:8080/api/products/${productId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadProductList();
                    } else {
                        alert('Failed to delete product: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error deleting product:', error);
                    alert('Error deleting product');
                });
            }
        }

        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('active'));
                tabPanes.forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.getAttribute('data-tab');
                document.querySelector(`.form-tab-pane[data-tab="${tab}"]`) || 
                    (tab === 'readymade' ? readymadeForm : customForm).classList.add('active');
            });
        });

        readyCategory.addEventListener('change', updatePriceUnit);

        customTypeSelect.addEventListener('change', () => {
            const type = customTypeSelect.value;
            trouserFields.classList.toggle('hidden', type !== 'Trouser');
            inseamField.classList.toggle('hidden', type !== 'Trouser');
            shirtFields.classList.toggle('hidden', type !== 'Shirt');
            sleeveField.classList.toggle('hidden', type !== 'Shirt');
        });

        openBtn.addEventListener('click', () => toggleModal(true));
        closeBtn.addEventListener('click', () => toggleModal(false));
        document.getElementById('cancelReadymadeBtn').addEventListener('click', () => toggleModal(false));
        document.getElementById('cancelCustomBtn').addEventListener('click', () => toggleModal(false));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) toggleModal(false);
        });

        readymadeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById('readymadeStatus');
            const submitBtn = readymadeForm.querySelector('button[type="submit"]');
            statusEl.textContent = '';
            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Saving...';
            const formData = new FormData(readymadeForm);
            try {
                const res = await fetch('http://localhost:8080/api/products/upload', {
                    method: 'POST',
                    body: formData
                });
                const body = await res.json();
                if (!res.ok || !body.success) {
                    throw new Error(body.message || 'Failed to save');
                }
                readymadeForm.reset();
                toggleModal(false);
                loadProductList();
            } catch (err) {
                statusEl.textContent = err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        customForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById('customStatus');
            const submitBtn = customForm.querySelector('button[type="submit"]');
            statusEl.textContent = '';
            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Saving...';
            const formData = new FormData(customForm);
            try {
                const res = await fetch('http://localhost:8080/api/custom-products/upload', {
                    method: 'POST',
                    body: formData
                });
                const body = await res.json();
                if (!res.ok || !body.success) {
                    throw new Error(body.message || 'Failed to save');
                }
                customForm.reset();
                toggleModal(false);
                loadProductList();
            } catch (err) {
                statusEl.textContent = err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadProductList();
        });
    </script>
</body>
</html>
